name: CalcVault
options:
  bundleIdPrefix: com.calcvault
  deploymentTarget:
    iOS: "16.0"
targets:
  CalcVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CalcVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcvault.app
        PRODUCT_NAME: Calculator
        INFOPLIST_FILE: CalcVault/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalcVault.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
