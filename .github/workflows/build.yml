name: Build iOS App (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Icon
        run: |
          sips -s format png CalcVault/Assets.xcassets/AppIcon.appiconset/AppIcon.jpg --out CalcVault/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application Bundle
        run: |
          xcodebuild build \
            -project CalcVault.xcodeproj \
            -scheme CalcVault \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # البحث عن ملف التطبيق المترجم ونسخه إلى Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q CalcVault.ipa Payload
          echo "CalcVault.ipa generated successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcVault-IPA
          path: CalcVault.ipa
          retention-days: 14
